<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BearWatch: full-site mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Poppins, system-ui, sans-serif; }

  /* ---------- mockup chrome (not part of the app) ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 14px; align-items: center; font-size: 13px; }
  .controls .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .controls span { opacity: .7; margin-right: 2px; }
  .controls button { font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border, #ccc); background: transparent; color: inherit; cursor: pointer; }
  .controls button.on { background: var(--foreground, #222); color: var(--background, #fff); }
  .stage { position: relative; overflow: hidden; }
  .device { position: absolute; top: 0; left: 0; transform-origin: top left; }
  .device.desktop { width: 1280px; height: 836px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .device.desktop .chrome { height: 36px; background: #2b2b2b; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .device.desktop .chrome i { width: 11px; height: 11px; border-radius: 50%; background: #5a5a5a; }
  .device.desktop .chrome .url { margin-left: 18px; flex: 0 1 460px; background: #1a1a1a; color: #bbb; font-size: 12px; padding: 4px 12px; border-radius: 6px; }
  .device.desktop .app { height: 800px; }
  .device.mobile { width: 375px; height: 760px; border-radius: 34px; overflow: hidden; box-shadow: 0 0 0 9px #151515; margin: 9px; }
  .device.mobile .chrome { display: none; }
  .device.mobile .app { height: 100%; }

  /* ================= the app ================= */
  .app {
    --paper: #EFE4CB; --ink: #2a211b; --surface: #F8F1E0; --forest: #1F3B2D; --sage: #7C9A7E; --wood: #6B4A2F; --wood-dark: #4a3220;
    --cream: #F2E6CC; --gold: #D4A23C; --ok: #2f6b45; --bad: #9c3219;
    container: app / inline-size;
    position: relative; overflow: hidden; color: var(--ink); font-size: 14px;
    background: repeating-linear-gradient(0deg, rgba(107,74,47,.035) 0 2px, transparent 2px 5px), var(--paper);
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .desk { display: none !important; }
  h1, h2, h3 { font-family: 'Zilla Slab', serif; color: var(--forest); }
  a, .link { color: var(--wood); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  /* header band */
  .band { position: relative; z-index: 4; background: var(--forest); color: var(--cream); display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; border-bottom: 4px solid var(--wood); flex: none; }
  .band .mark { width: 32px; height: 32px; overflow: hidden; border-radius: 50%; flex: none; }
  .band .mark img { height: 32px; display: block; }
  .band .t { font-family: 'Zilla Slab', serif; font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
  .band .back { background: none; border: 0; color: var(--cream); font-size: 26px; line-height: 1; padding: 0 4px 0 0; cursor: pointer; }
  .band .me { margin-left: auto; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; background: none; border: 0; color: inherit; font-family: inherit; padding: 4px 8px; border-radius: 8px; }
  .band .me:hover, .band .me.open { background: rgba(242,230,204,.12); }
  .band .me .caret { font-size: 10px; opacity: .8; }
  .menu { position: absolute; right: 14px; top: 58px; width: 220px; background: var(--surface); color: var(--ink); border: 3px double var(--forest); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 6px; z-index: 6; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; color: inherit; }
  .menu button:hover { background: rgba(31,59,45,.08); }
  .menu .ico { width: 18px; height: 18px; }
  .menu hr { border: 0; border-top: 1px dashed rgba(31,59,45,.3); margin: 4px 6px; }
  .menu .danger { color: var(--bad); }

  /* buttons */
  .sso { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; margin-bottom: 12px; cursor: pointer; border: 0; border-radius: 6px;
         font-family: 'Zilla Slab', serif; font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--cream); background: var(--wood);
         box-shadow: inset 0 0 0 3px var(--wood), inset 0 0 0 4.5px rgba(242,230,204,.55), 0 3px 0 var(--wood-dark); }
  .sso svg { width: 18px; height: 18px; flex: none; }
  .sso .gbadge { background: var(--cream); border-radius: 50%; padding: 3px; width: 24px; height: 24px; display: grid; place-items: center; }
  .sso.dark { background: var(--forest); box-shadow: inset 0 0 0 3px var(--forest), inset 0 0 0 4.5px rgba(242,230,204,.55), 0 3px 0 #10241a; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; cursor: pointer; border: 0; border-radius: 6px;
         font-family: 'Zilla Slab', serif; font-size: 16px; font-weight: 600; background: var(--forest); color: var(--cream); box-shadow: 0 3px 0 #10241a; }
  .btn.wide { width: 100%; padding: 12px; font-size: 17px; }
  .btn.wood { background: var(--wood); box-shadow: 0 3px 0 var(--wood-dark); }
  .btn.gold { background: var(--gold); color: var(--forest); box-shadow: 0 3px 0 #9c7524; }
  .btn.ghost { background: transparent; color: var(--forest); box-shadow: inset 0 0 0 2px var(--forest); }
  .btn.danger { background: var(--bad); box-shadow: 0 3px 0 #5e1d0e; }
  .btn.ghost.danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); }
  .btn.sm { padding: 6px 12px; font-size: 14px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn .ico { width: 18px; height: 18px; }
  .fine { font-size: 11px; opacity: .75; margin-top: 12px; line-height: 1.5; }

  /* ----- login ----- */
  .login { flex: 1; display: grid; min-height: 0; }
  .login-hero { display: none; }
  .login-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 28px; text-align: center; overflow-y: auto; }
  .login-panel .logo { width: 190px; height: 190px; }
  .login-panel h1 { margin: 0 0 4px; font-size: 32px; }
  .lede { font-size: 14px; line-height: 1.55; margin: 22px 0; }
  .login-panel .inner { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; }

  /* ----- card screens (nickname / banned) ----- */
  .cardwrap { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 40px 26px; overflow-y: auto; }
  .card { width: 100%; max-width: 440px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .card h1 { font-size: 28px; margin: 0 0 6px; }
  .field { width: 100%; text-align: left; margin-bottom: 14px; position: relative; }
  .field label { display: block; font-family: 'Zilla Slab', serif; font-size: 15px; font-weight: 600; color: var(--forest); margin-bottom: 6px; }
  .field .row { position: relative; }
  .field input, .field textarea, .field select { width: 100%; font: inherit; font-size: 15px; padding: 11px 12px; outline: none; border: 2px solid var(--forest); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .field textarea { resize: vertical; min-height: 80px; }
  .field input:focus, .field textarea:focus { box-shadow: 0 0 0 3px rgba(212,162,60,.45); }
  .field .count { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: .6; }
  .field .hint { font-size: 12px; opacity: .75; margin-top: 6px; line-height: 1.45; }
  .msg { min-height: 18px; font-size: 12px; margin-top: 6px; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .banicon { width: 84px; height: 84px; margin-bottom: 14px; }
  .reason { width: 100%; text-align: left; padding: 14px; margin: 18px 0 8px; font-size: 13px; line-height: 1.5; background: var(--surface); border: 3px double var(--bad); border-radius: 10px; }
  .reason small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }

  /* ----- signed-in shell ----- */
  .layout { flex: 1; min-height: 0; display: block; }
  .main { padding-bottom: 16px; }
  .pagehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
  .pagehead h2 { margin: 0; font-size: 26px; }
  .pad { padding: 0 14px; }
  .near { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; background: var(--wood); color: var(--cream); padding: 4px 9px; border-radius: 4px; white-space: nowrap; }
  .near svg { width: 12px; height: 12px; }
  .panel { background: var(--surface); border: 3px double var(--forest); border-radius: 12px; }
  .locask { margin: 4px 14px 16px; padding: 16px; text-align: center; font-size: 13px; line-height: 1.5; }
  .empty { margin: 4px 14px 16px; padding: 26px 18px; text-align: center; font-size: 13px; line-height: 1.55; }
  .empty h3 { margin: 6px 0; font-size: 20px; }

  .post { margin: 0 14px 16px; overflow: hidden; }
  .post .who { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .post .who b { font-family: 'Zilla Slab', serif; font-size: 16px; }
  .post .who time { margin-left: auto; font-size: 11px; opacity: .6; }
  .post .photo { cursor: pointer; }
  .where { display: flex; align-items: center; gap: 5px; padding: 9px 12px 12px; font-family: 'Zilla Slab', serif; font-size: 14px; font-weight: 600; color: var(--wood); border-top: 1px dashed rgba(31,59,45,.35); }
  .where svg { width: 13px; height: 13px; flex: none; }
  .winbadge { display: inline-flex; align-items: center; gap: 5px; background: var(--gold); color: var(--forest); font-family: 'Zilla Slab', serif; font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 4px; }
  .winbadge svg { width: 14px; height: 14px; }
  .photo .winbadge { position: absolute; top: 8px; left: 8px; z-index: 1; }

  .av { width: 32px; height: 32px; border-radius: 50%; flex: none; overflow: hidden; display: grid; place-items: center; background: var(--forest); border: 2px solid var(--gold); position: relative; }
  .av > svg { width: 70%; height: 70%; fill: var(--cream); }
  .av.xl { width: 84px; height: 84px; border-width: 3px; }
  .av.photo .bear { transform: scale(2.6); transform-origin: 84% 40%; }
  .av.photo .bear.flip { transform: scaleX(-1) scale(2.6); }

  .photo { position: relative; aspect-ratio: 1 / 1; overflow: hidden; }
  .photo .bear { position: absolute; width: 58%; left: 21%; bottom: 16%; fill: #2e2118; }
  .photo .bear.flip { transform: scaleX(-1); }
  .s1 { background: linear-gradient(#a9c0c4 0 30%, #6f8f6a 30% 55%, #4f7381 55%); }
  .s2 { background: linear-gradient(#e8dcb2 0 35%, #b9a55c 35% 60%, #8d7b3b 60%); }
  .s3 { background: linear-gradient(#5d7a5e 0 45%, #3b5640 45% 70%, #2c4030 70%); }
  .s4 { background: linear-gradient(#dfe7ea 0 40%, #aab8b5 40% 62%, #e9eef0 62%); }
  .s5 { background: linear-gradient(#f0c9a0 0 32%, #a07a5a 32% 58%, #6d8a6a 58%); }
  .s2 .bear { fill: #5a3a22; } .s3 .bear { fill: #1a1410; } .s4 .bear { fill: #4a3324; } .s5 .bear { fill: #3a2616; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 4px 14px; background: var(--forest); color: rgba(242,230,204,.6); border-top: 4px solid var(--wood); flex: none; }
  .tabs button { background: none; border: 0; font-family: 'Zilla Slab', serif; font-size: 12px; font-weight: 600; letter-spacing: .04em; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; color: inherit; }
  .tabs button.on { color: var(--gold); }
  .ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* signpost nav (desktop) */
  .side { position: relative; padding: 26px 0 0 28px; flex-direction: column; }
  .side::before { content: ""; position: absolute; left: 58px; top: 18px; bottom: 0; width: 14px; background: linear-gradient(90deg, #5a3d26, var(--wood) 40%, #5a3d26); border-radius: 3px 3px 0 0; }
  .plank { position: relative; display: flex; align-items: center; gap: 10px; width: 200px; margin-bottom: 14px; padding: 11px 26px 11px 14px; white-space: nowrap; border: 0; cursor: pointer;
           font-family: 'Zilla Slab', serif; font-size: 18px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--cream); background: var(--wood);
           clip-path: polygon(0 0, 86% 0, 100% 50%, 86% 100%, 0 100%); text-align: left; }
  .plank:nth-child(even) { margin-left: 10px; }
  .plank .ico { width: 20px; height: 20px; }
  .plank.on { background: var(--forest); color: var(--gold); }
  .plank.post-cta { background: var(--gold); color: var(--forest); }
  .plank.post-cta.on { box-shadow: inset 0 0 0 3px var(--forest); }
  .rail { display: none; }
  .rcard { padding: 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.5; }
  .rcard h3 { margin: 0 0 8px; font-size: 19px; display: flex; align-items: center; gap: 8px; }
  .rcard h3 svg { width: 22px; height: 22px; }
  .rcard .photo { border-radius: 8px; margin-bottom: 8px; }
  .rcard ol { margin: 0; padding-left: 20px; }
  .rcard ol li { margin-bottom: 4px; }
  .champ .name { font-family: 'Zilla Slab', serif; font-size: 18px; font-weight: 700; color: var(--forest); }
  .champ .credit { font-size: 11px; opacity: .8; margin-top: 6px; }
  .rail .foot { font-size: 11px; opacity: .6; padding: 0 4px; }
  .champ-mob { margin: 0 14px 16px; padding: 10px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .champ-mob .photo { width: 58px; border-radius: 8px; flex: none; }
  .champ-mob .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--wood); display: flex; align-items: center; gap: 4px; }
  .champ-mob .k svg { width: 14px; height: 14px; }
  .champ-mob .name { font-family: 'Zilla Slab', serif; font-size: 17px; font-weight: 700; color: var(--forest); }

  /* ----- post form ----- */
  .drop { margin: 4px 14px 16px; padding: 34px 18px; text-align: center; border: 2px dashed var(--wood); border-radius: 12px; background: rgba(248,241,224,.7); cursor: pointer; }
  .drop .big { width: 54px; height: 54px; color: var(--wood); margin-bottom: 6px; }
  .drop h3 { margin: 4px 0; font-size: 20px; }
  .drop p { margin: 4px 0 14px; font-size: 13px; opacity: .8; }
  .preview { margin: 4px 14px 14px; overflow: hidden; }
  .preview .bar { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; font-size: 12px; border-top: 1px dashed rgba(31,59,45,.35); }
  .okchip { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); font-weight: 600; }
  .okchip svg { width: 14px; height: 14px; }
  .suggest { position: absolute; left: 0; right: 0; top: 100%; margin-top: -10px; z-index: 3; background: var(--surface); border: 2px solid var(--forest); border-top: 0; border-radius: 0 0 8px 8px; max-height: 210px; overflow-y: auto; }
  .suggest button { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 9px 12px; font: inherit; font-size: 13px; cursor: pointer; color: inherit; }
  .suggest button:hover { background: rgba(31,59,45,.08); }
  .suggest button svg { width: 14px; height: 14px; color: var(--wood); flex: none; }
  .suggest .here { font-weight: 600; color: var(--forest); border-bottom: 1px dashed rgba(31,59,45,.3); }
  .formpad { padding: 0 14px; }
  .checking { margin: 30px 14px; padding: 34px 20px; text-align: center; }
  .spin { width: 46px; height: 46px; margin: 0 auto 14px; border: 4px solid rgba(31,59,45,.18); border-top-color: var(--forest); border-radius: 50%; animation: sp .9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .steps { list-style: none; margin: 14px auto 0; padding: 0; max-width: 260px; text-align: left; font-size: 13px; }
  .steps li { padding: 3px 0; opacity: .5; }
  .steps li.done { opacity: 1; color: var(--ok); }
  .steps li.now { opacity: 1; font-weight: 600; }
  .oops { margin: 4px 14px 16px; padding: 22px 18px; text-align: center; border-color: var(--bad) !important; }
  .oops h3 { color: var(--bad); margin: 8px 0; font-size: 21px; }
  .oops p { font-size: 14px; line-height: 1.55; margin: 0 0 16px; }

  /* ----- profile ----- */
  .phead { display: flex; gap: 16px; align-items: center; padding: 18px 16px 8px; }
  .phead h2 { margin: 0 0 8px; font-size: 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .adminchip { font-family: Poppins, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--forest); color: var(--gold); padding: 3px 7px; border-radius: 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, auto); gap: 14px; justify-content: start; }
  .stats div { text-align: left; }
  .stats b { display: flex; align-items: center; gap: 4px; font-family: 'Zilla Slab', serif; font-size: 20px; color: var(--forest); line-height: 1.1; }
  .stats b svg { width: 16px; height: 16px; }
  .stats small { font-size: 11px; opacity: .75; }
  .pactions { display: flex; gap: 8px; padding: 8px 16px 16px; flex-wrap: wrap; }
  .pactions .btn { flex: 1; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .grid3 .photo { cursor: pointer; }
  .grid3 .photo .winbadge { top: 5px; left: 5px; padding: 3px; }
  .grid3 .photo .winbadge span { display: none; }
  .ptitle { display: flex; align-items: center; gap: 8px; padding: 6px 16px 10px; font-family: 'Zilla Slab', serif; font-weight: 700; color: var(--forest); font-size: 16px; border-top: 1px dashed rgba(31,59,45,.35); padding-top: 14px; }
  .meonly { padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .meonly .fine { text-align: center; margin: 0; }

  /* ----- admin ----- */
  .atabs { display: flex; gap: 8px; padding: 0 14px 14px; }
  .atabs button { flex: 1; padding: 9px 10px; border-radius: 6px; border: 2px solid var(--forest); background: transparent; color: var(--forest); font-family: 'Zilla Slab', serif; font-size: 15px; font-weight: 700; cursor: pointer; }
  .atabs button.on { background: var(--forest); color: var(--gold); }
  .ulist { margin: 0 14px 16px; overflow: hidden; }
  .urow { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-bottom: 1px dashed rgba(31,59,45,.3); }
  .urow:last-child { border-bottom: 0; }
  .urow .info { flex: 1; min-width: 0; }
  .urow .info b { font-family: 'Zilla Slab', serif; font-size: 16px; cursor: pointer; }
  .urow .meta { font-size: 11px; opacity: .7; }
  .urow .why { font-size: 12px; color: var(--bad); margin-top: 2px; }
  .status { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
  .status.active { background: rgba(47,107,69,.15); color: var(--ok); }
  .status.banned { background: rgba(156,50,25,.15); color: var(--bad); }
  .fbw { display: grid; gap: 16px; padding: 0 14px 16px; }
  .fbw .form { padding: 16px; }
  .fbw .form h3 { margin: 0 0 12px; font-size: 19px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .radios { display: flex; gap: 8px; margin-bottom: 14px; }
  .radios label { flex: 1; display: flex; gap: 8px; align-items: center; padding: 9px 10px; border: 2px solid rgba(31,59,45,.35); border-radius: 6px; cursor: pointer; font-size: 13px; }
  .radios label.on { border-color: var(--forest); background: rgba(31,59,45,.06); font-weight: 600; }
  .uploadrow { display: flex; gap: 10px; align-items: center; }
  .uploadrow .photo { width: 64px; border-radius: 6px; flex: none; }
  .winlist .urow .photo { width: 46px; border-radius: 6px; flex: none; cursor: pointer; }
  .previewlabel { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin: 0 0 8px; }

  /* ----- modals ----- */
  .scrim { position: absolute; inset: 0; z-index: 10; background: rgba(20,28,22,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { position: relative; width: 100%; max-width: 520px; max-height: 100%; display: flex; flex-direction: column; background: var(--surface); border: 3px double var(--forest); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.35); overflow: hidden; }
  .modal.sm { max-width: 420px; }
  .modal .mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px dashed rgba(31,59,45,.35); flex: none; }
  .modal .mhead h3 { margin: 0; font-size: 21px; }
  .modal .x { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; color: var(--forest); padding: 0 4px; }
  .modal .mbody { padding: 16px; overflow-y: auto; min-height: 0; font-size: 13px; line-height: 1.6; }
  .modal .mfoot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px dashed rgba(31,59,45,.35); flex: none; }

let POSTS = [

/* ---------------- small view helpers ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bearSvg = flip => ICON.bear.replace('class="bear"', `class="bear${flip ? " flip" : ""}"`);

const postById = id => POSTS.find(p => p.id === +id);
function avatar(nick, cls = "") {
  const u = USERS[nick];

}
const isMe = nick => nick === ME;
const winsOf = nick => POSTS.filter(p => p.nick === nick && p.win).length;
const followingOf = nick => isMe(nick) ? S.follows.size : USERS[nick].following;
const followersOf = nick => USERS[nick].followers + (S.follows.has(nick) && !["grizzwald", "trail_mix_tina"].includes(nick) ? 1 : 0) - (!S.follows.has(nick) && ["grizzwald", "trail_mix_tina"].includes(nick) ? 1 : 0);

  return `<header class="band">${back}<div class="mark"><img src="${CORNER}" alt=""></div><span class="t">Bear Watch</span>${me}${menu}</header>`;
}

const TABS = [["global", "Global"], ["following", "Following"], ["post", "Post"], ["me", "Profile"]];
function shell(content, { rail = false, wide = false } = {}) {
  const active = r => S.route === r;

    </div>
    <nav class="tabs">${TABS.map(([r, n]) => `<button class="${active(r) ? "on" : ""}" data-act="go" data-arg="${r}">${ICON[n]}${n}</button>`).join("")}</nav>
  </section>`;
}

function champCard(f = S.fbw) {
  const fromPost = f.src === "post" && postById(f.postId);
  const p = fromPost ? postById(f.postId) : null;
  const pic = p ? photo(p.scene, p.flip) : photo(f.scene, false);
  const credit = p
    ? `Photo by <span class="link" data-act="user" data-arg="${p.nick}">${p.nick}</span> on Bear Watch`
    : `${esc(f.credit)}${f.link ? ` · <span class="link" data-act="toast" data-arg="Opens ${esc(f.link)} in a new tab">${esc(f.linkText || "Link")} ↗</span>` : ""}`;
  return `<div class="rcard panel champ">
    <h3><span style="color:var(--gold);display:flex">${ICON.trophy}</span>Fat Bear Week ${esc(f.year)}</h3>
    ${pic}
    <div class="name">${esc(f.name)}${f.num ? ` <span style="font-weight:500;font-size:14px;opacity:.75">(Bear ${esc(f.num)})</span>` : ""}</div>
    <div>${esc(f.blurb)}</div>
    <div class="credit">${credit}</div>
  </div>`;
}
const rulesCard = () => `<div class="rcard panel"><h3>${ICON.tree}Trail rules</h3><ol><li>Bears only.</li><li>No people in photos.</li><li>Keep nicknames and photos clean.</li></ol><p class="fine" style="margin-top:8px"><span class="link" data-act="tos">Full Terms of Service</span></p></div>`;

  </div>`;
}

function postCard(p) {
  return `<article class="post panel">
    <div class="who" data-act="user" data-arg="${p.nick}">${avatar(p.nick)}<b>${p.nick}</b><time>${p.when}</time></div>
    <div data-act="modal" data-arg="post:${p.id}">${photo(p.scene, p.flip, p.win ? winBadge(p.win) : "")}</div>
    <div class="where">${ICON.pin}${p.where}</div>

}

      ${champMobile()}
      ${S.loc ? posts.map(postCard).join("") : `<div class="locask panel"><b>See bears near you</b><br>Allow location to see sightings within 500 miles. We use it for this search only and never save it.<button class="btn wide" style="margin-top:10px" data-act="allow">${ICON.locate.replace("<svg", '<svg class="ico"')}Use my location</button></div>`}`;

      <p class="fine" style="text-align:center">One bear every minute. Bears only, no people. See the <span class="link" data-act="tos">Terms of Service</span>.</p>`;

    <div class="mhead"><h3>Terms of Service</h3></div>
    <div class="mbody">
      <div class="draft">Draft for the mockup. The real text needs a proper review before launch.</div>
      <h4>1. Bears only</h4><p>Bear Watch is for photos of bears. Every upload is checked automatically, and photos without a clear bear are turned away. Repeatedly posting photos that aren't bears can get your account banned.</p>
      <h4>2. No people, nothing explicit</h4><p>Your photos must not include people, and must never include sexually explicit, violent or hateful content.</p>
      <h4>3. Nicknames</h4><p>Nicknames must be 3 to 20 characters and must not contain slurs, profanity, or impersonate someone else (including Bear Watch staff). Nicknames can't be changed once chosen.</p>

      <h4>5. Location and privacy</h4><p>We sign you in through Google or GitHub and only keep the account ID they give us, never your password or email. Your browser location is used for the Global feed search and is never saved. Photo locations are rounded to about 10 km and shown as a place name. We remove location and camera data from every photo.</p>
      <h4>6. Respect the bears</h4><p>Keep a safe distance. Never approach, feed or disturb a bear for a photo. Follow park rules and ranger instructions.</p>
      <h4>7. Bans</h4><p>Bear Watch admins can ban accounts that break these terms. Banned users will see the reason when they sign in.</p>
      <h4>8. Changes</h4><p>We may update these terms. If the changes are significant we'll let you know on the site.</p>
      <p style="opacity:.7;margin-top:14px">Last updated: November 2026</p>
    </div>
    <div class="mfoot"><button class="btn" data-act="close">Close</button></div>
  </div></div>`;

  if (m === "champ") return `<div class="scrim" data-act="scrim"><div class="modal sm">

      </div>
      ${mine || admin ? `<div class="mfoot">
        ${admin ? (p.win ? `<button class="btn ghost sm" data-act="revoke" data-arg="${p.id}">Revoke ${p.win} win</button>` : `<button class="btn gold sm" data-act="award" data-arg="${p.id}">${ICON.trophy.replace("<svg", '<svg width="16" height="16"')}Award Fat Bear Week win</button>`) : ""}
        ${mine ? `<button class="btn ghost danger sm" data-act="delete" data-arg="${p.id}">Delete post</button>` : ""}
      </div>` : ""}

  if (m.startsWith("ban:")) {

        <p style="margin-top:0">They'll be signed out and see this reason every time they try to sign in. Their posts are hidden from feeds.</p>

            ${mine.map(p => `<div class="${d.scene === p.scene && !!d.flip === !!p.flip ? "on" : ""}" data-act="avpick" data-arg="${p.id}">${photo(p.scene, p.flip)}</div>`).join("")}

    </div></div>`;
  }
  return "";
}

/* ---------------- render + events ---------------- */
const root = document.querySelector(".app");
const stage = document.querySelector(".stage");
const device = document.querySelector(".device");

function view() {
  switch (S.route) {
    case "login": return loginView();
    case "nickname": return nicknameView();
    case "banned": return bannedView();
    case "global": return feedView("global");
    case "following": return feedView("following");
    case "post": return postView();
    case "me": return profileView(ME);
    case "user": return profileView(S.viewing);
    case "admin": return adminView();
  }
}

function render(keepScroll = true) {
  const old = root.querySelector(".layout");
  const top = keepScroll && old ? old.scrollTop : 0;
  const mscroll = root.querySelector(".modal .mbody")?.scrollTop || 0;
  root.innerHTML = view() + modalView() + `<div class="toast"></div>`;
  const nu = root.querySelector(".layout");
  if (nu) nu.scrollTop = top;
  const mb = root.querySelector(".modal .mbody");
  if (mb) mb.scrollTop = mscroll;
  wireInputs();
  syncControls();
}

function go(route, arg) {
  if (route === "user" && isMe(arg)) route = "me";
  if (!["user"].includes(S.route)) S.prev = S.route;
  S.route = route; S.viewing = arg || null; S.menu = false; S.modal = null;
  render(false);
}

function toast(text) {
  const t = root.querySelector(".toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1700);
}

const BLOCKED = ["admin", "moderator", "bearwatch", "ranger"]; // stand-in for the real profanity list
const TAKEN = Object.keys(USERS);

function wireInputs() {
  const nick = root.querySelector(".nick");
  if (nick) nick.addEventListener("input", e => {
    const v = e.target.value, msg = root.querySelector(".msg");
    root.querySelector(".count").textContent = `${v.length}/20`;
    let text = "", ok = false;
    if (!v) text = "";
    else if (!/^[A-Za-z0-9_]+$/.test(v)) text = "Letters, numbers and underscores only.";
    else if (v.length < 3) text = "At least 3 characters.";
    else if (BLOCKED.some(w => v.toLowerCase().includes(w))) text = "That nickname isn't allowed.";
    else if (TAKEN.includes(v.toLowerCase())) text = "Taken. Another bear watcher got there first.";
    else { text = "Available!"; ok = true; }
    msg.textContent = text; msg.className = "msg " + (ok ? "ok" : "bad");
    root.querySelector("#nickgo").disabled = !ok;
  });

  const place = root.querySelector(".place");
  if (place) {
    const box = root.querySelector(".suggest");
    const show = () => {
      const q = place.value.trim().toLowerCase();
      const hits = PLACES.filter(p => p.toLowerCase().includes(q)).slice(0, 6);
      box.innerHTML = `<button class="here" data-act="place" data-arg="Fort Collins, CO">${ICON.locate}Use where I am now</button>` +
        hits.map(p => `<button data-act="place" data-arg="${p}">${ICON.pin}${p}</button>`).join("");
      box.hidden = false;
    };
    place.addEventListener("focus", show);
    place.addEventListener("input", () => { S.post.place = ""; root.querySelector('[data-act="submit"]').disabled = true; show(); });
  }

  const us = root.querySelector(".usearch");
  if (us) us.addEventListener("input", () => {
    const q = us.value.toLowerCase();
    root.querySelectorAll(".urow[data-nick]").forEach(r => r.style.display = r.dataset.nick.includes(q) ? "" : "none");
  });

  root.querySelectorAll("[data-fbw]").forEach(inp => inp.addEventListener(inp.tagName === "SELECT" ? "change" : "input", () => {
    S.fbw[inp.dataset.fbw] = inp.value;
    root.querySelector(".fbwprev").innerHTML = champCard();
  }));

  const ban = root.querySelector(".banreason");
  if (ban) ban.addEventListener("input", () => { S.banDraft = ban.value; root.querySelector("#banok").disabled = !ban.value.trim(); });

  const zoom = root.querySelector(".zoom");
  if (zoom) zoom.addEventListener("input", () => {
    S.avDraft.zoom = +zoom.value;
    root.querySelector(".ring .bear").style.transform = `${S.avDraft.flip ? "scaleX(-1) " : ""}scale(${zoom.value})`;
  });
}

root.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (S.menu && !e.target.closest(".menu, .me")) { S.menu = false; if (!el) return render(); }
  if (!el) {
    const sug = root.querySelector(".suggest");
    if (sug && !e.target.closest(".field")) sug.hidden = true;
    return;
  }
  const act = el.dataset.act, arg = el.dataset.arg;
  if (act === "scrim" && e.target !== el) return; // clicks inside the modal
  switch (act) {
    case "go": go(arg); break;
    case "back": go(S.prev || "global"); break;
    case "user": go("user", arg); break;
    case "menu": S.menu = !S.menu; render(); break;
    case "signout": S.menu = false; S.modal = null; go("login"); break;
    case "tos": S.menu = false; S.modal = "tos"; render(); break;
    case "modal": S.modal = arg; if (arg.startsWith("ban:")) S.banDraft = ""; if (arg === "avatar") S.avDraft = null; render(); break;
    case "close": case "scrim": S.modal = null; render(); break;
    case "toast": toast(arg); break;
    case "allow": S.loc = true; render(); break;
    case "follow":
      S.follows.has(arg) ? S.follows.delete(arg) : S.follows.add(arg);
      render(); toast(S.follows.has(arg) ? `Following ${arg}` : `Unfollowed ${arg}`); break;
    case "pickphoto": S.post = { stage: "ready", place: "" }; render(); break;
    case "place": S.post.place = arg; render(); break;
    case "submit":
      S.post.stage = "checking"; render();
      setTimeout(() => {
        if (S.route !== "post") return;
        if (S.detectFail) { S.post.stage = "blurry"; render(); return; }
        POSTS.unshift({ id: Date.now() % 100000, nick: ME, scene: "s5", flip: 1, when: "now", where: S.post.place });
        S.post = { stage: "empty", place: "" }; S.loc = true; go("global"); toast("Your bear is on the trail!");
      }, 1800);
      break;
    case "retry": S.post = { stage: "empty", place: "" }; render(); break;
    case "atab": S.adminTab = arg; render(false); break;
    case "banchip": S.banDraft = arg + "."; render(); break;
    case "banok": S.bans[arg] = S.banDraft.trim(); S.modal = null; render(); toast(`${arg} has been banned`); break;
    case "unban": delete S.bans[arg]; render(); toast(`${arg} has been unbanned`); break;
    case "award": postById(arg).win = +S.fbw.year || 2026; render(); toast(`Fat Bear Week ${postById(arg).win} win awarded`); break;
    case "revoke": delete postById(arg).win; render(); toast("Win revoked"); break;
    case "delete": POSTS = POSTS.filter(p => p.id !== +arg); S.modal = null; render(); toast("Post deleted"); break;
    case "fbwsrc": S.fbw.src = arg; render(); break;
    case "fbwupload": S.fbw.scene = S.fbw.scene === "s5" ? "s2" : "s5"; render(); toast("Photo replaced"); break;
    case "avpick": {
      if (!arg) S.avDraft = { scene: null, zoom: 2.6 };
      else { const p = postById(arg); S.avDraft = { scene: p.scene, flip: p.flip, zoom: 2.6 }; }
      render(); break;
    }
    case "avsave": USERS[ME].av = S.avDraft.scene; USERS[ME].avFlip = S.avDraft.flip; S.modal = null; render(); toast("Bear face updated"); break;
  }
});

/* ---------------- mockup controls ---------------- */
function syncControls() {
  const key = S.route === "user" ? `user:${S.viewing}` : S.route;
  document.querySelectorAll('[data-g="route"] button').forEach(b => b.classList.toggle("on", b.dataset.jump === key));
}
function fit() {
  const m = device.classList.contains("mobile") ? 18 : 0;
  const w = device.offsetWidth + m, h = device.offsetHeight + m;
  const s = Math.min(1, stage.clientWidth / w);
  device.style.transform = `scale(${s})`;
  device.style.left = `${Math.max(0, (stage.clientWidth - w * s) / 2)}px`;
  stage.style.height = `${h * s}px`;
}
new ResizeObserver(fit).observe(stage);
document.getElementById("controls").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.jump) { const [r, a] = b.dataset.jump.split(":"); S.loc = S.loc || r === "global"; go(r, a); }
  if (b.dataset.device) { device.className = `device ${b.dataset.device}`; fit(); }
  if (b.dataset.detector) S.detectFail = b.dataset.detector === "fail";
  if (!b.dataset.jump) b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
});
render();
</script>

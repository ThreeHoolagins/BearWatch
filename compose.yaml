# Development stack:  docker compose up
#   http://localhost:5173  -> Vite dev server (SPA). /api, /auth and /media are
#                             proxied to Rails, so the browser sees one origin.
# Production lives in compose.prod.yaml.
#
# Like production, the photo worker and bear detector sit only on the
# `internal` network, which has no internet access.

name: bearwatch-dev

x-rails-env: &rails-env
  RAILS_ENV: development
  DATABASE_HOST: db
  DATABASE_USERNAME: root
  DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  DETECTOR_URL: http://detector:8000

services:
  web:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      <<: *rails-env
      # Runs the "online" job queue (R2 uploads, alert email, usage checks)
      # inside the web server, which has internet access.
      SOLID_QUEUE_IN_PUMA: "1"
      SOLID_QUEUE_CONFIG: config/queue_web.yml
      SOLID_QUEUE_SKIP_RECURRING: "true"
    volumes:
      - ./backend:/rails
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/up"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      db:
        condition: service_healthy
    networks: [default, internal]

  # Processes uploads (libvips + bear check). No internet access.
  worker:
    build:
      context: ./backend
      target: dev
    command: ["bin/jobs"]
    env_file: .env
    environment: *rails-env
    volumes:
      - ./backend:/rails
      - bundle:/usr/local/bundle
    depends_on:
      web:
        condition: service_healthy # web installs gems and runs migrations
      detector:
        condition: service_healthy
    networks: [internal]

  detector:
    build: ./detector
    environment:
      BEAR_CONFIDENCE_THRESHOLD: ${BEAR_CONFIDENCE_THRESHOLD:-0.85}
      PERSON_MAX_SCORE: ${PERSON_MAX_SCORE:-0.20}
    networks: [internal]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://web:3000
      # Bind mounts from Windows don't deliver file events; poll instead.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks: [internal]

networks:
  default: {}
  internal:
    internal: true

volumes:
  bundle:
  frontend_node_modules:
  db_data:

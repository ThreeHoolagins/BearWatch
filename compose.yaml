# Development stack:  docker compose up
#   http://localhost:5173  -> Vite dev server (SPA). /api and /auth are proxied
#                             to Rails, so the browser sees a single origin.
# Production lives in compose.prod.yaml.

name: bearwatch-dev

services:
  web:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./backend:/rails
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://web:3000
      # Bind mounts from Windows don't deliver file events; poll instead.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  bundle:
  frontend_node_modules:
  db_data:

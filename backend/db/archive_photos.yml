# Historic bear photos posted by nps_historic_archive (bin/rails bearwatch:archive:import).
#
# Mostly from Yellowstone's online slide file, which says: "These images are in
# the public domain and may be reproduced, free of charge with the proper credit
# line" ("NPS Photo" or "NPS Photo by <photographer>"). Only photos by NPS staff
# or uncredited NPS photos are listed; the slide file also holds work by outside
# photographers, which isn't ours to use.
#
# Every photo here passed the detector (a bear, no person) when it was picked.
# taken_on is a year, or a date when the archive gives one. latitude/longitude
# are rounded to one decimal like every post.

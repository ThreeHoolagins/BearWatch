# Connection settings come from the environment (see .env.example and compose files).
default: &default
  adapter: trilogy
  encoding: utf8mb4
  collation: utf8mb4_0900_ai_ci
  # Request threads plus room for Solid Queue (polling, heartbeat, dispatcher),
  # which shares this process when it runs in async mode. It's a ceiling: idle
  # connections aren't opened.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 3).to_i + 5 %>
  host: <%= ENV.fetch("DATABASE_HOST") { "127.0.0.1" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "root" } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: bearwatch_development

# Erased and regenerated from the development schema by `bin/rails test`.
test:
  <<: *default
  database: bearwatch_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "bearwatch" } %>

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Bear Watch on one small EC2 instance running compose.prod.yaml. No SSH (SSM Session Manager
  only), config in SSM Parameter Store under /bearwatch/, nightly MySQL + photo backups to S3.
  Deploys: GitHub Actions CI moves the `production` branch when main passes; CodePipeline V2
  (GitHub via CodeConnections) picks it up and CodeBuild runs infra/aws/deploy.sh (SSM Run
  Command -> git checkout + docker compose up --build). No long-lived credentials.

Parameters:
  GitHubRepository:
    Type: String
    Default: ThreeHoolagins/BearWatch
    Description: owner/repo that CodePipeline deploys from.
  BranchName:
    Type: String
    Default: production
    Description: CI fast-forwards this branch to main once tests pass.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  RootVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 20

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          # Database dumps are small; keep a month of them.
          - Id: expire-old-dumps
            Status: Enabled
            Prefix: mysql/
            ExpirationInDays: 30
          # Photos are synced (a mirror), so only old versions of deleted ones expire.
          - Id: expire-deleted-photos
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 14 }

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt BackupBucket.Arn, !Sub "${BackupBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  BackupBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /bearwatch/BACKUP_BUCKET
      Type: String
      Value: !Ref BackupBucket

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: bearwatch-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AppConfig
                Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameter]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bearwatch*
              - Sid: ListBackups
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
              - Sid: WriteBackups
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub ${BackupBucket.Arn}/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${AWS::StackName}-instance
      Roles: [!Ref InstanceRole]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bear Watch web (HTTP/HTTPS only, no SSH)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0", Description: HTTP v6 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: HTTPS v6 }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-web" }

  Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      DisableApiTermination: true
      CreditSpecification: { CPUCredits: standard }
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-prod" }
        - { Key: Project, Value: bearwatch }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker git
          systemctl enable --now docker
          plugins=/usr/local/lib/docker/cli-plugins
          mkdir -p $plugins
          curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64 \
            -o $plugins/docker-compose
          buildx=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/docker/buildx/releases/latest | sed 's#.*/##')
          curl -fsSL "https://github.com/docker/buildx/releases/download/${buildx}/buildx-${buildx}.linux-arm64" \
            -o $plugins/docker-buildx
          chmod +x $plugins/*
          # 2 GiB swap: the first image build and libvips spikes need it on a small box.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
            echo 'vm.swappiness=10' > /etc/sysctl.d/99-swap.conf && sysctl --system
          fi
          mkdir -p /opt/bearwatch
          touch /opt/bearwatch/.bootstrapped

  PublicIp:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-prod" }

  # ---------------------------------------------------------------- CI/CD
  # Same shape as the FF15 stack. GitHub Actions can't hold AWS credentials here
  # (the org SCP blocks OIDC providers), so AWS pulls from GitHub instead.
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Metadata:
      com.aws.cloudformation.Context:
        must: Starts PENDING; authorize it once in Developer Tools > Settings > Connections.
    Properties:
      ConnectionName: !Sub ${AWS::StackName}-github
      ProviderType: GitHub

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Source zips are only needed while a run is in progress.
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 7

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${AWS::StackName}
      RetentionInDays: 14

  BuildRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        must: SendCommand limited to this instance and the AWS-RunShellScript document.
    Properties:
      RoleName: !Sub ${AWS::StackName}-codebuild
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-deploy" }
      Policies:
        - PolicyName: bearwatch-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogGroup.Arn
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Sid: Deploy
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: DeployStatus
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-deploy
      ServiceRole: !GetAtt BuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: infra/aws/buildspec.yml }
      Artifacts: { Type: CODEPIPELINE }
      # The first build on a fresh instance takes 20-40 minutes.
      TimeoutInMinutes: 75
      Environment:
        # Nothing is built here (the instance builds its own images), so the smallest Arm box.
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        EnvironmentVariables:
          - { Name: INSTANCE_ID, Value: !Ref Instance }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref BuildLogGroup }

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: bearwatch-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Sid: Source
                Effect: Allow
                Action: codeconnections:UseConnection
                Resource: !Ref GitHubConnection
                Condition:
                  StringEquals: { codeconnections:FullRepositoryId: !Ref GitHubRepository }
              - Sid: Build
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt BuildProject.Arn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Metadata:
      com.aws.cloudformation.Context:
        why: Every push to the production branch redeploys. QUEUED so deploys never overlap.
    Properties:
      Name: !Sub ${AWS::StackName}-deploy
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches: { Includes: [!Ref BranchName] }
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              Namespace: SourceVariables
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: "1" }
              OutputArtifacts: [{ Name: SourceOutput }]
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: false
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              InputArtifacts: [{ Name: SourceOutput }]
              Configuration:
                ProjectName: !Ref BuildProject
                EnvironmentVariables: '[{"name":"COMMIT_ID","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]'

Outputs:
  ConnectionArn:
    Value: !Ref GitHubConnection
    Description: Authorize this once in the console (Developer Tools > Settings > Connections).
  PipelineName:
    Value: !Ref Pipeline
  PublicIp:
    Value: !Ref PublicIp
    Description: Point the DNS A record for APP_HOST here.
  InstanceId:
    Value: !Ref Instance
  BackupBucketName:
    Value: !Ref BackupBucket
